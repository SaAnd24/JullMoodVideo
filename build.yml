name: Build APK (JullMood Video)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Si subiste el proyecto como .zip (cualquier nombre), lo descomprime.
      # Si subiste las carpetas sueltas, no hace nada.
      - name: Descomprimir proyecto (si hay zip)
        run: |
          for z in *.zip; do
            [ -e "$z" ] && unzip -q -o "$z"
          done
          true

      # Busca el proyecto de Video por su nombre (por si en el repo también está JullMood Music).
      - name: Localizar proyecto
        run: |
          f=$(grep -rl --include=settings.gradle.kts 'rootProject.name = "JullMoodVideo"' . | head -n 1)
          [ -n "$f" ] || { echo "No se encontró el proyecto JullMoodVideo (settings.gradle.kts)"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Proyecto en: $(dirname "$f")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Compilar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: JullMoodVideo-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
